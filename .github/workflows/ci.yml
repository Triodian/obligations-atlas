name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the code: the token GitHub gives it cannot push, merge or change settings.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Data check (schemas, language rules, provenance hashes)
        run: npm run data:check
      - run: npm test
      - name: Worker bundles
        run: npx wrangler deploy --dry-run --outdir dist

  # Deploys main to Cloudflare Workers from GitHub Actions, so a deploy does not
  # depend on Cloudflare's own Git connection. Runs only when the repository has
  # the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skip (no Cloudflare token set)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy from Actions."
      - name: Deploy to Cloudflare Workers
        if: env.HAS_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
